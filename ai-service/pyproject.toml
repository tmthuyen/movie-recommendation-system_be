[project]
name = "movie-recommendation"
version = "0.1.0"
description = "Movie Recommendation System"
readme = "README.md"
requires-python = ">=3.9"


dependencies = [
    # 1. Core Data & Math
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pre-commit>=2.0.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"