# CORS: khớp danh sách origin của Kong cũ (5173, 3002)
map $http_origin $cors_origin {
    default "";
    http://localhost:5173 $http_origin;
    http://localhost:3002 $http_origin;
    https://moviere-drs.vercel.app $http_origin;
}

# Socket.IO: upgrade cho WebSocket, polling dùng close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 120 request/phút/IP (tương đương rate-limiting plugin của Kong)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=2r/s;
limit_req_status 429;
limit_req_log_level warn;

# DNS nội bộ Docker: phân giải lúc chạy để Nginx không crash khi backend/ai-service chưa lên.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8081 resolve max_fails=3 fail_timeout=10s;
    # Khi scale ngang: thêm dòng "server backend-2:8081 resolve max_fails=3 fail_timeout=10s;"
    keepalive 32;
}

upstream ai_upstream {
    zone ai_upstream 64k;
    server ai-service:8082 resolve max_fails=3 fail_timeout=10s;
    # Khi scale ngang: thêm dòng "server ai-service-2:8082 resolve max_fails=3 fail_timeout=10s;"
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";
    proxy_next_upstream error timeout http_502 http_503 http_504;

    # Backend/AI cũng tự gắn CORS; ẩn header upstream để Nginx là lớp duy nhất.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    add_header X-Request-ID $request_id always;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type, X-Request-ID, traceparent, tracestate" always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Expose-Headers "X-Request-ID" always;
    add_header Access-Control-Max-Age 3600 always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # SSE của backend: tắt buffering để event-stream không bị gom
    location = /api/chat/stream {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_buffering off;
        proxy_pass http://backend_upstream;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_upstream;
    }

    location = /api {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_upstream;
    }

    # Client gọi /api/ai/... -> chỉ bỏ segment /ai, giữ nguyên phần còn lại.
    # Ví dụ: /api/ai/recommendations/similar/1 -> /api/recommendations/similar/1.
    # Mọi /api/... còn lại (kể cả /api/recommendations/...) đi backend qua location /api/.
    location /api/ai/ {
        rewrite ^/api/ai(/.*)$ /api$1 break;
        limit_req zone=api_limit burst=20 nodelay;
        proxy_buffering off;
        proxy_pass http://ai_upstream;
    }

    location = /api/ai {
        rewrite ^/api/ai$ /api break;
        limit_req zone=api_limit burst=20 nodelay;
        proxy_buffering off;
        proxy_pass http://ai_upstream;
    }

    location /socket.io/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://backend_upstream;
    }

    location / {
        return 404;
    }
}

# Chỉ cho exporter scrape qua network nội bộ, không public qua cổng 80.
server {
    listen 8080;
    server_name _;

    location = /nginx_status {
        stub_status;
        access_log off;
    }
}
