services:
  # ==========================================================
  # DATABASE
  # ==========================================================
  db:
    ports:
      - '5434:5432'

  # ==========================================================
  # VECTOR DB
  # ==========================================================
  qdrant:
    ports:
      - '6333:6333'
      - '6334:6334'

  # ==========================================================
  # CACHE
  # ==========================================================
  redis:
    ports:
      - '6379:6379'

  # ==========================================================
  # REDIS INSIGHT
  # Activated with --profile tools
  # ==========================================================
  redis-insight:
    ports:
      - '5540:5540'

  # ==========================================================
  # MESSAGE BROKER
  # ==========================================================
  rabbitmq:
    ports:
      - '5672:5672'
      - '15672:15672'

  # ==========================================================
  # NESTJS BACKEND - DEVELOPMENT
  # ==========================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development

    env_file:
      - ../backend/.env

    environment:
      NODE_ENV: development
      PORT: 8081
      CHOKIDAR_USEPOLLING: 'true'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8082
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672

    ports:
      - '8081:8081'

    volumes:
      # Source code hot reload
      - ../backend:/app

      # Container node_modules
      - backend_node_modules:/app/node_modules

    command:
      - npm
      - run
      - dev

  # ==========================================================
  # FASTAPI AI SERVICE - DEVELOPMENT
  # ==========================================================
  ai-service:
    build:
      target: development

    env_file:
      - ../ai-service/.env

    environment:
      ENVIRONMENT: development
      PORT: 8082
      QDRANT_URL: http://qdrant:6333
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - '8082:8082'

    volumes:
      - ../ai-service:/app
    command:
      - uvicorn
      - src.api.server:app
      - --host
      - 0.0.0.0
      - --port
      - '8082'
      - --reload

  # ==========================================================
  # KONG
  # ==========================================================
  kong:
    ports:
      - '8000:8000'
      - '8443:8443'
      - '8001:8001'

  # ==========================================================
  # OBSERVABILITY
  # ==========================================================
  prometheus:
    ports:
      - '9090:9090'

  grafana:
    ports:
      - '3000:3000'

  jaeger:
    ports:
      - '16686:16686'
      - '4318:4318'
      - '4317:4317'

volumes:
  backend_node_modules:
