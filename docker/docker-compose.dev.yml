services:
  # db
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    ports:
      - '5434:5432' # 5432 trùng port mặc định
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: nestjs_db
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - movie-network

  # vector db (Qdrant cho BM25 Sparse Vector & Hybrid Search)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - movie-network

  # caching
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - movie-network

  # Redis UI
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - '5540:5540'
    volumes:
      - redis_insight_data:/data
    restart: unless-stopped
    networks:
      - movie-network

  # message broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672' # RabbitMQ Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - movie-network

  # ==========================================
  # NGINX API GATEWAY (Kong giữ lại để rollback)
  # ==========================================

  # Kong cũ:
  # kong:
  #   image: kong:latest
  #   container_name: kong
  #   restart: unless-stopped
  #   environment:
  #     KONG_DATABASE: 'off'
  #     KONG_DECLARATIVE_CONFIG: /kong/kong.yml
  #     KONG_PROXY_ACCESS_LOG: /dev/stdout
  #     KONG_PROXY_ERROR_LOG: /dev/stderr
  #     KONG_ADMIN_ACCESS_LOG: /dev/stdout
  #     KONG_ADMIN_ERROR_LOG: /dev/stderr
  #     KONG_ADMIN_LISTEN: 0.0.0.0:8001
  #   ports:
  #     - '8000:8000'
  #     - '8443:8443'
  #     - '8001:8001'
  #   volumes:
  #     - ../gateway/kong.yml:/kong/kong.yml:ro
  #   extra_hosts:
  #     - 'host.docker.internal:host-gateway'
  #   networks:
  #     - movie-network

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped

    ports:
      - '8000:80'

    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../gateway/conf.d:/etc/nginx/conf.d:ro

    networks:
      - movie-network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.0
    container_name: nginx-exporter
    restart: unless-stopped

    command:
      - --nginx.scrape-uri=http://nginx:8080/nginx_status

    expose:
      - '9113'

    depends_on:
      - nginx

    networks:
      - movie-network

  # ==========================================
  # PROMETHEUS
  # ==========================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    ports:
      - '9090:9090'

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

    networks:
      - movie-network

  # ==========================================
  # GRAFANA
  # ==========================================

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    ports:
      - '3000:3000'

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - movie-network

  # ==========================================
  # JAEGER
  # ==========================================

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped

    ports:
      - '16686:16686'
      - '4318:4318'
      - '4317:4317'

    networks:
      - movie-network

networks:
  movie-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_insight_data:
    driver: local
  qdrant_data:
    driver: local
