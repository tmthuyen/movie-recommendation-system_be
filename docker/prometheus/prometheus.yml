global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend'
    scrape_interval: 5s
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: 'ai'
    metrics_path: '/api/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8082']
