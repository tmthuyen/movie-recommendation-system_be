name: AI-SERVICE CI

on:
  push:
    branches: [dev, ci-cd]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-CI.yml'
  pull_request:
    branches: [dev, ci-cd]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-CI.yml'

concurrency:
  group: ai-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-service-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    defaults:
      run:
        working-directory: ai-service
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          else
            echo "pyproject.toml not found"
            exit 1
          fi
        shell: bash

      - name: Lint (black + isort)
        run: |
          black --check src
          isort --check-only src
        shell: bash

      - name: Type check (pyright/pyrefly if available)
        run: |
          if command -v pyright >/dev/null 2>&1; then
            pyright --project src
          elif command -v pyrefly >/dev/null 2>&1; then
            pyrefly check src
          else
            echo "No type checker binary found; skipping."
          fi
        shell: bash

      - name: Run tests
        run: |
          if pytest --version >/dev/null 2>&1; then
            pytest tests/ -v
          fi
        shell: bash 
      
      - name: Verify application
        run: |
          python -c "import src.api.server; print('BUILD_OK')"
        shell: bash
