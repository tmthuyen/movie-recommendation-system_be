name: BACKEND CI

on:
  push:
    branches: [dev, ci-cd]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-CI.yml'
  pull_request:
    branches: [dev, ci-cd]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-CI.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
# NestJS Ci
  backend-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # NestJS 11 yêu cầu Node >= 20
        node-version: ['20.x', '22.x']
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (matrix)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci
        shell: bash

      - name: Lint
        run: |
          npm run lint
        shell: bash

      - name: Type check
        run: |
          npm run type-check
          npx tsc --noEmit
        shell: bash

      - name: Test
        run: |
          npm test -- --passWithNoTests
        shell: bash

      - name: Build
        run: |
          npm run build
        shell: bash
