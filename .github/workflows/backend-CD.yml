name: BACKEND CD

on:
  push:
    branches: [main, production]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-CD.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Validate, build and publish movie-backend
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.metadata.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and compile NestJS
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry name and tags
        id: metadata
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          image="${DOCKERHUB_USERNAME}/movie-backend"
          immutable_ref="${image}:sha-${GITHUB_SHA}"
          echo "image_ref=${immutable_ref}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.metadata.outputs.image_ref }}
            ${{ steps.metadata.outputs.image_name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Published image
        run: echo "Image pushed - ${{ steps.metadata.outputs.image_ref }}"

