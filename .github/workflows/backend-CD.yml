name: BACKEND CD

on:
  push:
    branches: [main, production]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-CD.yml'
  pull_request:
    branches: [main, production]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-CD.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # CI - VALIDATE NESTJS SOURCE CODE
  # Runs on PR, Push and manual dispatch
  # ============================================================
  validate:
    name: Validate code - Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build NestJS
        working-directory: backend
        run: npm run build

  # ============================================================
  # CI/CD - BUILD DOCKER IMAGE
  #
  # Pull Request:
  #   Build Docker image without pushing
  #
  # Push to main / production:
  #   Build and push image to Docker Hub
  #
  # Manual dispatch on main / production:
  #   Build and push image
  # ============================================================
  build-and-push:
    name: Build Docker image - Backend
    needs: validate
    runs-on: ubuntu-latest

    outputs:
      image_ref: ${{ steps.metadata.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry name and tags
        id: metadata
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          image="${DOCKERHUB_USERNAME}/movie-backend"
          immutable_ref="${image}:sha-${GITHUB_SHA}"

          echo "image_ref=${immutable_ref}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
           (github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/production'))
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          platforms: linux/amd64
          push: >-
            ${{
              github.event_name == 'push' ||
              (github.event_name == 'workflow_dispatch' &&
               (github.ref == 'refs/heads/main' ||
                github.ref == 'refs/heads/production'))
            }}
          tags: |
            ${{ steps.metadata.outputs.image_ref }}
            ${{ steps.metadata.outputs.image_name }}:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}

          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Published image
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
           (github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/production'))
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
        run: echo "Image pushed - $IMAGE_REF"

  # ============================================================
  # DEPLOYMENT: VPS / CLOUD VM via SSH
  # Requires secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_PRIVATE_KEY,
  #                   DEPLOY_SSH_KNOWN_HOSTS
  # VPS must already have Docker Compose, .env.production and registry login.
  # ============================================================
  deploy-vps:
    name: Deploy to VPS - Backend
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/production'))
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Pull latest image and restart backend via Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/moviere-drs' }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<EOF
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          export BACKEND_IMAGE="${IMAGE_REF}"

          docker compose \
            --env-file .env.production \
            -p movie-app-prod \
            -f docker/docker-compose.yml \
            -f docker/compose.prod.yml \
            --profile tools \
            up -d --no-deps --pull always backend
          EOF

