name: AI-SERVICE CD

on:
  push:
    branches: [main, production]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-CD.yml'
  pull_request:
    branches: [main, production]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-CD.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-service-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # CI - VALIDATE FASTAPI
  # Runs on PR, Push and manual dispatch
  # ============================================================
  validate:
    name: Validate code - AI Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

  # ============================================================
  # CI/CD - BUILD DOCKER IMAGE
  #
  # Pull Request:
  #   Build production image without pushing
  #
  # Push main / production:
  #   Build and push image to Docker Hub
  #
  # Manual dispatch on main / production:
  #   Build and push image
  # ============================================================
  build-and-push:
    name: Build Docker image - AI Service
    needs: validate
    runs-on: ubuntu-latest

    outputs:
      image_ref: ${{ steps.metadata.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry name and tags
        id: metadata
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          image="${DOCKERHUB_USERNAME}/movie-ai-service"
          immutable_ref="${image}:sha-${GITHUB_SHA}"

          echo "image_ref=${immutable_ref}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
           (github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/production'))
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          target: production
          platforms: linux/amd64
          push: >-
            ${{
              github.event_name == 'push' ||
              (github.event_name == 'workflow_dispatch' &&
               (github.ref == 'refs/heads/main' ||
                github.ref == 'refs/heads/production'))
            }}
          tags: |
            ${{ steps.metadata.outputs.image_ref }}
            ${{ steps.metadata.outputs.image_name }}:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

      - name: Published image
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
           (github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/production'))
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
        run: echo "Image pushed - $IMAGE_REF"

